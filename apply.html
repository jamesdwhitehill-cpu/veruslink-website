<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply: Vero by VerusLink</title>
  <meta name="description" content="See if Vero is a fit for your business. Tell us about yourself and we'll get back to you within 24 hours.">
  <link rel="canonical" href="https://veruslink.au/apply">
  <link rel="stylesheet" href="/assets/swiss.css">
  <link rel="stylesheet" href="/assets/pages.css">
</head>
<body>

  <div class="apply-container">
    <a href="/" class="apply-logo">Vero</a>

    <h1 class="apply-heading">See if Vero is a fit</h1>
    <p class="apply-sub">Tell us a bit about your business. We'll review your application and get back to you within 24 hours.</p>

    <div class="apply-card">
      <div class="form-error" id="formError"></div>

      <form id="applyForm" novalidate>
        <input type="hidden" name="source" value="veruslink-homepage">

        <div class="form-group">
          <label class="form-label" for="name">Name</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="Your full name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="you@business.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="business_type">Business type</label>
          <select id="business_type" name="business_type" class="form-select" required>
            <option value="" disabled selected>Select your industry</option>
            <option value="trades">Trades / Construction</option>
            <option value="professional-services">Professional Services</option>
            <option value="creative">Creative / Design / Media</option>
            <option value="coaching">Coaching / Consulting</option>
            <option value="finance">Finance / Accounting</option>
            <option value="health">Health / Wellness</option>
            <option value="real-estate">Real Estate / Property</option>
            <option value="ecommerce">E-Commerce / Retail</option>
            <option value="tech">Tech / SaaS</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="frustration">What's your biggest admin frustration right now?</label>
          <textarea id="frustration" name="frustration" class="form-textarea" placeholder="e.g. I spend hours on receipts every month, leads fall through the cracks..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="revenue">Annual revenue range <span class="form-optional">(optional)</span></label>
          <select id="revenue" name="revenue" class="form-select">
            <option value="" selected>Prefer not to say</option>
            <option value="under-100k">Under $100k</option>
            <option value="100k-250k">$100k - $250k</option>
            <option value="250k-500k">$250k - $500k</option>
            <option value="500k-1m">$500k - $1M</option>
            <option value="1m-plus">$1M+</option>
          </select>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Continue &rarr;</button>
      </form>
    </div>

    <div class="apply-footer">
      <a href="/">&larr; Back to veruslink.au</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('applyForm');
    const errorEl = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');

      const name = form.name.value.trim();
      const email = form.email.value.trim();
      const business_type = form.business_type.value;
      const frustration = form.frustration.value.trim();
      const revenue = form.revenue.value;
      const source = form.source.value;

      if (!name || !email || !business_type || !frustration) {
        errorEl.textContent = 'Please fill in all required fields.';
        errorEl.classList.add('visible');
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errorEl.textContent = 'Please enter a valid email address.';
        errorEl.classList.add('visible');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting\u2026';

      try {
        const res = await fetch('https://api.veruslink.au/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, business_type, frustration, revenue, source }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Something went wrong. Please try again.');
        }

        const nsParams = new URLSearchParams({
          source: source,
          name: name,
          email: email,
          business: form.business_type.options[form.business_type.selectedIndex].text,
        });
        window.location.href = '/next-steps?' + nsParams.toString();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Continue \u2192';
      }
    });
  </script>
</body>
</html>
