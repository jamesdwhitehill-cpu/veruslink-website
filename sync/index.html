<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerusLink Sync: Stop polling. Start syncing.</title>
<meta name="description" content="Share a single code. Update your availability once. Everyone who needs to know, knows.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/sync/sync.css">
</head>
<body>
<nav>
  <a href="/" class="logo">VerusLink</a>
  <div class="nav-right"><a href="/sync/view.html">Have a code?</a></div>
</nav>

<div class="container narrow">
  <div class="eyebrow">Group scheduling</div>
  <h1>Stop polling.<br>Start syncing.</h1>
  <p class="sub">Find the perfect time for everyone, without the back and forth.</p>

  <div id="banner" class="banner hidden"></div>

  <!-- SIGN IN -->
  <div class="card" id="signin-card">
    <h2 style="margin-bottom:18px">Sign in</h2>
    <form id="signin-form" autocomplete="on">
      <div class="field">
        <label for="si-email">Email</label>
        <input type="email" id="si-email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="si-btn">Sign in →</button>
    </form>
    <p class="faint" style="text-align:center;font-size:13px;margin-top:16px">
      Don't have an account? <a href="#" id="to-signup">Sign up</a>
    </p>
  </div>

  <!-- SIGN UP -->
  <div class="card hidden" id="signup-card">
    <h2 style="margin-bottom:18px">Create your account</h2>
    <form id="signup-form" autocomplete="on">
      <div class="field">
        <label for="su-name">Name</label>
        <input type="text" id="su-name" placeholder="Your name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" placeholder="••••••••" autocomplete="new-password" required minlength="8">
        <div class="hint">At least 8 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="su-btn">Create account →</button>
    </form>
    <p class="faint" style="text-align:center;font-size:13px;margin-top:16px">
      Already have an account? <a href="#" id="to-signin">Sign in</a>
    </p>
  </div>
</div>

<footer>
  Powered by <a href="https://veruslink.au">VerusLink</a>
</footer>

<script>
const banner = document.getElementById('banner');
const signinCard = document.getElementById('signin-card');
const signupCard = document.getElementById('signup-card');

function showError(msg){ banner.className='banner err'; banner.textContent=msg; }
function clearBanner(){ banner.className='banner hidden'; banner.textContent=''; }

// ---- view toggle ----
document.getElementById('to-signup').addEventListener('click', (e)=>{
  e.preventDefault(); clearBanner();
  signinCard.classList.add('hidden'); signupCard.classList.remove('hidden');
  document.getElementById('su-name').focus();
});
document.getElementById('to-signin').addEventListener('click', (e)=>{
  e.preventDefault(); clearBanner();
  signupCard.classList.add('hidden'); signinCard.classList.remove('hidden');
  document.getElementById('si-email').focus();
});

// If already signed in, skip straight to the dashboard.
(async function checkSession(){
  try{
    const r = await fetch('/api/sync-auth', { method:'GET', credentials:'same-origin' });
    const j = await r.json().catch(()=>({}));
    if (j && j.authenticated) window.location.href = '/sync/dashboard.html';
  }catch(_){ /* stay on the sign-in page */ }
})();

async function auth(body, btn, defaultLabel){
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Please wait…';
  clearBanner();
  try {
    const r = await fetch('/api/sync-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
    window.location.href = '/sync/dashboard.html';
  } catch (err) {
    showError(err.message || 'Something went wrong. Please try again.');
    btn.disabled = false;
    btn.textContent = defaultLabel;
  }
}

// ---- sign in ----
document.getElementById('signin-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  const email = document.getElementById('si-email').value.trim().toLowerCase();
  const password = document.getElementById('si-password').value;
  if (!email || !password) return;
  auth({ email, password }, document.getElementById('si-btn'), 'Sign in →');
});

// ---- sign up ----
document.getElementById('signup-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim().toLowerCase();
  const password = document.getElementById('su-password').value;
  if (!name || !email || !password) return;
  if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
  auth({ name, email, password }, document.getElementById('su-btn'), 'Create account →');
});
</script>
</body>
</html>
