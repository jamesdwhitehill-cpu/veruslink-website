<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Concierge Insights | VerusLink Blog</title>
<meta name="description" content="What we're seeing, building, and learning as an AI concierge for Australian small business. Plain-English insights, real examples, no hype.">
<link rel="canonical" href="https://veruslink.au/blog">
<meta property="og:title" content="AI Concierge Insights | VerusLink Blog">
<meta property="og:description" content="What we're seeing, building, and learning as an AI concierge for Australian small business.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://veruslink.au/blog">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/swiss.css">
<link rel="stylesheet" href="/assets/blog.css">
</head>
<body>

<nav>
  <a href="/" class="logo">VerusLink</a>
  <div class="nav-links">
    <a href="/#how-it-works" class="nav-link">How it works</a>
    <a href="/#about" class="nav-link">About</a>
    <a href="/blog" class="nav-link active">Blog</a>
    <a href="/#faqs" class="nav-link">FAQs</a>
    <a href="/audit" class="nav-cta">Start the free audit</a>
  </div>
</nav>

<header class="blog-hero">
  <div class="kicker"><span class="dot"></span>The VerusLink Blog</div>
  <h1>AI Concierge Insights</h1>
  <p>What we're seeing, building, and learning. No hype, no jargon, just what actually works.</p>
</header>

<main class="blog-grid" id="grid">
  <div class="blog-empty">Loading posts&hellip;</div>
</main>

<footer>
  <div class="footer-logo">VerusLink</div>
  <div class="footer-links">
    <a href="mailto:james@veruslink.au" class="footer-link">james@veruslink.au</a>
    <a href="/privacy" class="footer-link">Privacy</a>
    <a href="/terms" class="footer-link">Terms</a>
  </div>
</footer>

<script>
(function () {
  var PILLS = {
    'insight': { label: 'Insight', cls: 'pill-insight' },
    'build': { label: 'Build', cls: 'pill-build' },
    'client-story': { label: 'Client Story', cls: 'pill-client' },
    'guide': { label: 'Guide', cls: 'pill-guide' }
  };
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }
  function fmtDate(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
    if(!m) return esc(iso);
    return parseInt(m[3],10) + ' ' + MONTHS[parseInt(m[2],10)-1] + ' ' + m[1];
  }
  function card(p){
    var pill = PILLS[p.category] || PILLS.insight;
    var rt = p.readTime ? (' &middot; ' + p.readTime + ' min read') : '';
    return '<a class="blog-card" href="/blog/' + encodeURIComponent(p.slug) + '.html">'
      + '<span class="pill ' + pill.cls + '">' + pill.label + '</span>'
      + '<h2>' + esc(p.title) + '</h2>'
      + '<p class="excerpt">' + esc(p.excerpt) + '</p>'
      + '<div class="meta">' + fmtDate(p.date) + rt + '</div>'
      + '</a>';
  }
  var grid = document.getElementById('grid');
  fetch('/blog/posts.json', { cache: 'no-cache' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(posts){
      if(!Array.isArray(posts) || !posts.length){
        grid.innerHTML = '<div class="blog-empty">No posts yet. Check back soon.</div>';
        return;
      }
      posts.sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      grid.innerHTML = posts.map(card).join('');
    })
    .catch(function(){
      grid.innerHTML = '<div class="blog-empty">Posts are taking a moment to load. Please refresh.</div>';
    });
})();
</script>

</body>
</html>
